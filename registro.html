<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Registro en Polyglots</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== RESET Y BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f1724, #1a2a4a);
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            color: #f0f7ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ===== CONTENEDOR PRINCIPAL ===== */
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        /* ===== HEADER ===== */
        .header {
            margin-bottom: 30px;
        }

        .header img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 16px;
            border: 3px solid rgba(79, 195, 247, 0.3);
            box-shadow: 0 0 40px rgba(79, 195, 247, 0.1);
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4fc3f7, #81c784);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 0.95rem;
            color: #90a4ae;
            margin-top: 4px;
            -webkit-text-fill-color: #90a4ae;
        }

        /* ===== FORMULARIO ===== */
        .register-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 18px;
        }

        .register-form input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            font-size: 1rem;
            outline: none;
            background: rgba(255, 255, 255, 0.04);
            color: #f0f7ff;
            transition: all 0.3s ease;
        }

        .register-form input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .register-form input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(79, 195, 247, 0.3);
            box-shadow: 0 0 20px rgba(79, 195, 247, 0.05);
        }

        .register-form .submit-button {
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #1a3a6a, #2a5a9a);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 6px;
        }

        .register-form .submit-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(79, 195, 247, 0.15);
        }

        .register-form .submit-button:active {
            transform: scale(0.97);
        }

        /* ===== BOTÓN GOOGLE ===== */
        .google-button {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            color: #f0f7ff;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .google-button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .google-button img {
            width: 22px;
            height: 22px;
            border-radius: 50%;
        }

        /* ===== ENLACE ADICIONAL ===== */
        .additional-link {
            margin-top: 20px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .additional-link a {
            color: #4fc3f7;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .additional-link a:hover {
            color: #81c784;
        }

        /* ===== SEPARADOR ===== */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 18px 0 14px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
        }

        /* ===== FOOTER ===== */
        footer {
            text-align: center;
            padding: 20px 16px 10px;
            margin-top: 30px;
            width: 100%;
            max-width: 420px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        footer .creditos {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            line-height: 1.8;
        }

        footer .creditos a {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            transition: color 0.3s;
        }

        footer .creditos a:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .container {
                padding: 28px 20px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .header img {
                width: 80px;
                height: 80px;
            }

            .register-form input {
                padding: 12px 14px;
                font-size: 0.95rem;
            }

            .register-form .submit-button,
            .google-button {
                padding: 12px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== CONTENEDOR PRINCIPAL ===== -->
    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <img src="https://polyglots-at.github.io/ex/logopolyglots.jpg" alt="Logo de Polyglots">
            <h1>Crear cuenta</h1>
            <p>Regístrate para comenzar</p>
        </div>

        <!-- ===== FORMULARIO ===== -->
        <form class="register-form" id="register-form">
            <input type="email" id="email" placeholder="Correo Electrónico" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <input type="password" id="confirm-password" placeholder="Confirmar Contraseña" required>
            <button type="submit" class="submit-button" id="register-button">
                <i class="fas fa-user-plus" style="margin-right:8px;"></i> Registrarse
            </button>
        </form>

        <!-- ===== SEPARADOR ===== -->
        <div class="divider">o</div>

        <!-- ===== BOTÓN GOOGLE ===== -->
        <button class="google-button" id="login-google">
            <img src="https://polyglots-at.github.io/contenido/logogoogle.jpg" alt="Logo de Google">
            Entrar con Google
        </button>

        <!-- ===== ENLACE INICIO DE SESIÓN ===== -->
        <p class="additional-link">
            ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a>
        </p>

    </div>

    <!-- ===== FOOTER ===== -->
    <footer>
        <div class="creditos">
            &copy; 2026 Polyglots. Todos los derechos reservados.<br>
            Contacto: <a href="mailto:polyglots.at@gmail.com">polyglots.at@gmail.com</a><br>
            <a href="privacidad.html">Política de Privacidad</a>
        </div>
    </footer>

    <!-- ===== FIREBASE ===== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIAzw3cN1oK6SlI1DOzOVNpCh_cJlSdd4",
            authDomain: "polyglots-2025.firebaseapp.com",
            projectId: "polyglots-2025",
            storageBucket: "polyglots-2025.firebasestorage.app",
            messagingSenderId: "867957511633",
            appId: "1:867957511633:web:4d97efaf50139e768e7cf0",
            measurementId: "G-BP9X7JRZRB"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'https://polyglots-at.github.io/cursos';
            }
        });

        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                alert("Las contraseñas no coinciden.");
                return;
            }

            createUserWithEmailAndPassword(auth, email, password)
                .then(() => {
                    window.location.href = 'https://polyglots-at.github.io/cursos';
                })
                .catch((error) => {
                    alert("Error al registrarse: " + error.message);
                });
        });

        document.getElementById('login-google').addEventListener('click', () => {
            signInWithPopup(auth, new GoogleAuthProvider())
                .then(() => {
                    window.location.href = 'https://polyglots-at.github.io/cursos';
                })
                .catch((error) => {
                    alert(error.code === 'auth/popup-closed-by-user'
                        ? "La ventana de autenticación se cerró. Intenta de nuevo."
                        : "Error al iniciar sesión: " + error.message);
                });
        });
    </script>

</body>
</html>
