<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
<title>Polyglots · Curso de Inglés con Castillos y Evaluaciones</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        background: linear-gradient(135deg, #0a0f1a, #0f1a2e, #1a2a4a);
        font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        color: #f0f7ff;
        line-height: 1.6;
        padding: 12px;
        display: flex;
        justify-content: center;
        min-height: 100vh;
    }
    .container {
        max-width: 900px;
        width: 100%;
        background: rgba(255,255,255,0.04);
        backdrop-filter: blur(6px);
        border-radius: 40px;
        padding: 20px 18px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        border: 1px solid rgba(255,255,255,0.06);
        position: relative;
    }
    /* ===== HEADER ===== */
    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(0,0,0,0.4);
        border-radius: 80px;
        padding: 12px 20px;
        margin-bottom: 20px;
        border: 1px solid rgba(255,255,255,0.08);
        flex-wrap: wrap;
        gap: 10px;
    }
    .logo-container {
        width: 72px; height: 72px;
        border-radius: 50%;
        overflow: hidden;
        flex-shrink: 0;
        border: 2px solid rgba(252,211,77,0.7);
        box-shadow: 0 0 25px rgba(252,211,77,0.35);
        background: #0a0f1a;
        position: relative;
        display: flex; align-items: center; justify-content: center;
    }
    .logo-container img {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(1.15);
        width: 100%; height: 100%;
        object-fit: cover; object-position: center; display: block;
    }
    .logo-fallback {
        display: none; width: 100%; height: 100%;
        background: radial-gradient(circle at 30% 30%, #fcd34d, #b45309);
        align-items: center; justify-content: center;
        font-size: 2.5rem; color: #0b1d3a; font-weight: bold;
        border-radius: 50%; text-shadow: 0 0 15px rgba(255,255,255,0.6);
    }
    .logo-container.fallback .logo-fallback { display: flex; }
    .logo-container.fallback img { display: none; }
    .header-title { font-size: 1.15rem; font-weight: 700; color: #e8f3ff; letter-spacing: 0.5px; }
    .header-progress { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #94a3b8; }
    .progress-bar-bg { width: 90px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #d4af37, #fcd34d); border-radius: 10px; transition: width 0.5s; }
    /* ===== VISTAS ===== */
    .view { display: none; animation: fadeSlide 0.3s ease; }
    .view.active { display: block; }
    @keyframes fadeSlide {
        0% { opacity: 0; transform: translateY(15px); }
        100% { opacity: 1; transform: translateY(0); }
    }
    /* ===== MAPA ===== */
    .map-header { text-align: center; margin-bottom: 20px; }
    .map-header h1 {
        font-size: 1.9rem; font-weight: 800;
        background: linear-gradient(135deg, #fcd34d, #d4af37);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text; letter-spacing: 1px;
    }
    .map-header p { color: #90a4ae; font-size: 0.9rem; }
    .map-container {
        position: relative;
        width: 100%;
        max-width: 820px;
        margin: 0 auto;
        min-height: 320px;
    }
    .map-path-svg {
        position: absolute; inset: 0; width: 100%; height: 100%;
        pointer-events: none; z-index: 1;
    }
    .map-path-svg path { filter: drop-shadow(0 0 6px rgba(212,175,55,0.5)); }
    .temple-marker {
        position: absolute;
        transform: translate(-50%,-50%) scale(var(--m-scale, 1));
        transform-origin: center;
        z-index: 3;
        cursor: pointer;
        width: 104px;
        transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), opacity .3s;
        text-align: center;
        touch-action: manipulation;
    }
    .temple-marker:hover { transform: translate(-50%,-50%) scale(calc(var(--m-scale, 1) * 1.06)); }
    .temple-marker.locked { opacity: 0.45; filter: grayscale(0.75); }
    .temple-marker.complete .temple-svg {
        filter: drop-shadow(0 0 var(--glow, 25px) rgba(252,211,77,0.8));
    }
    .temple-svg { width: 100%; height: auto; display: block; }
    .temple-label {
        margin-top: 4px;
        font-size: 0.68rem;
        color: #cbd5e1;
        font-weight: 600;
        text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        line-height: 1.2;
    }
    .temple-label .num {
        display: block;
        font-size: 0.55rem;
        color: #fcd34d;
        letter-spacing: 1px;
    }
    /* ===== LECHUZA FLOTANTE ===== */
    .owl-marker {
        position: absolute;
        z-index: 5;
        width: 96px; height: 96px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fcd34d, #b45309);
        box-shadow: 0 0 40px rgba(252,211,77,0.8), inset 0 0 20px rgba(0,0,0,0.5);
        border: 3px solid rgba(252,211,77,0.9);
        overflow: hidden;
        pointer-events: none;
        animation: owlHover 2.5s ease-in-out infinite;
        transition: left 1.2s cubic-bezier(.34,1.56,.64,1), top 1.2s cubic-bezier(.34,1.56,.64,1);
        display: flex; align-items: center; justify-content: center;
    }
    @keyframes owlHover {
        0%, 100% { transform: translate(-50%,-50%) translateY(-60px); }
        50% { transform: translate(-50%,-50%) translateY(-76px); }
    }
    .owl-marker img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .owl-fallback {
        display: none; font-size: 3rem; color: #0b1d3a; font-weight: bold;
        text-shadow: 0 0 20px rgba(255,255,255,0.5);
    }
    .owl-marker.fallback .owl-fallback { display: block; }
    .owl-marker.fallback img { display: none; }
    /* ===== VISTA TEMPLO ===== */
    .back-btn {
        background: rgba(255,255,255,0.08);
        border: none; color: #f0f7ff;
        padding: 8px 18px; border-radius: 40px;
        font-size: 0.85rem; font-weight: 600;
        cursor: pointer; transition: 0.2s;
        display: inline-flex; align-items: center; gap: 6px;
        margin-bottom: 16px;
        touch-action: manipulation;
    }
    .back-btn:hover { background: rgba(255,255,255,0.15); }
    .kingdom-header {
        text-align: center; padding: 20px 12px;
        background: rgba(30,41,59,0.6);
        border-radius: 20px;
        border: 1px solid rgba(212,175,55,0.2);
        margin-bottom: 18px;
    }
    .kingdom-header h2 { font-size: 1.7rem; font-weight: 700; color: #fcd34d; margin-bottom: 4px; }
    .kingdom-header p { color: #94a3b8; font-size: 0.9rem; }
    .play-btn {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        padding: 16px 44px; border-radius: 40px;
        background: linear-gradient(135deg, #d4af37, #fcd34d);
        color: #0b1d3a; font-weight: 800; font-size: 1.05rem; letter-spacing: 1px;
        box-shadow: 0 8px 25px rgba(212,175,55,0.5);
        border: none; cursor: pointer; transition: all 0.3s;
        margin: 10px auto 20px; width: fit-content;
        touch-action: manipulation;
    }
    .play-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 12px 35px rgba(212,175,55,0.7); }
    .eval-btn {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        padding: 14px 36px; border-radius: 40px;
        background: linear-gradient(135deg, #3b82f6, #1e40af);
        color: #fff; font-weight: 800; font-size: 0.95rem; letter-spacing: 1px;
        box-shadow: 0 8px 25px rgba(59,130,246,0.5);
        border: none; cursor: pointer; transition: all 0.3s;
        margin: 10px auto 20px; width: fit-content;
        touch-action: manipulation;
    }
    .eval-btn:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); box-shadow: 0 12px 35px rgba(59,130,246,0.7); }
    .eval-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
    .lesson-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px; margin-bottom: 20px;
    }
    .lesson-card {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px; padding: 18px 12px;
        text-decoration: none; color: #f0f7ff;
        text-align: center; transition: all 0.25s;
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        cursor: pointer;
        touch-action: manipulation;
    }
    .lesson-card:hover {
        transform: translateY(-4px);
        background: rgba(255,255,255,0.08);
        border-color: rgba(252,211,77,0.4);
    }
    .lesson-card.done { border-color: rgba(34,197,94,0.35); background: rgba(34,197,94,0.07); }
    .lesson-card .icon { font-size: 1.8rem; }
    .lesson-card .name { font-size: 0.78rem; font-weight: 600; color: #b3e5fc; text-transform: uppercase; letter-spacing: 0.5px; }
    /* ===== VOCABULARIO DEL TEMPLO ===== */
    .vocab-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 10px;
        margin-bottom: 20px;
    }
    .vocab-card {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 14px;
        padding: 12px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        transition: all 0.2s;
        touch-action: manipulation;
    }
    .vocab-card:hover {
        border-color: rgba(252,211,77,0.4);
        background: rgba(255,255,255,0.07);
        transform: translateY(-2px);
    }
    .vocab-card .vc-body { flex: 1; min-width: 0; }
    .vocab-card .vc-en {
        font-weight: 700; font-size: 0.92rem; color: #f0f7ff;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .vocab-card .vc-phon {
        font-family: monospace; font-size: 0.7rem; color: #fcd34d;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .vocab-card .vc-es { font-size: 0.78rem; color: #94a3b8; }
    .vocab-card .vc-speak {
        width: 32px; height: 32px; border-radius: 50%;
        background: rgba(212,175,55,0.18);
        border: 1px solid rgba(212,175,55,0.4);
        color: #fcd34d; font-size: 0.85rem;
        display: inline-flex; align-items: center; justify-content: center;
        flex-shrink: 0; transition: all 0.2s;
    }
    .vocab-card .vc-speak.speaking {
        background: #d4af37; color: #0b1d3a;
        animation: pulse 0.8s infinite;
    }
    /* ===== BLOQUES DE ETAPA Y CASTILLOS ===== */
    .stage-block { margin-bottom: 18px; }
    .stage-title {
        font-size: 0.75rem; text-transform: uppercase;
        letter-spacing: 0.15em; color: #fcd34d;
        margin: 6px 0 10px;
    }
    .castle-card {
        display: flex; align-items: center; gap: 14px;
        padding: 14px 16px; border-radius: 18px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
    }
    .castle-card .castle-emoji { font-size: 2rem; line-height: 1; }
    .castle-card .castle-info { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .castle-card .castle-info strong { color: #fcd34d; font-size: 0.95rem; letter-spacing: .5px; }
    .castle-card .castle-info span { font-size: 0.78rem; color: #94a3b8; }
    .castle-card.locked { opacity: 0.6; }
    .castle-card.unlocked { border-color: rgba(212,175,55,0.45); background: rgba(212,175,55,0.07); }
    .castle-card.passed { border-color: rgba(34,197,94,0.45); background: rgba(34,197,94,0.08); }
    .castle-card .eval-btn { margin: 0; padding: 11px 22px; font-size: 0.8rem; }
    /* ===== OVERLAY LECCIÓN ===== */
    .lesson-overlay {
        position: fixed; inset: 0; background: #0a0f1a;
        z-index: 1000; display: none; flex-direction: column;
    }
    .lesson-overlay.active { display: flex; }
    .lesson-overlay-header {
        background: rgba(0,0,0,0.9); padding: 14px 22px;
        display: flex; align-items: center; justify-content: space-between; gap: 14px;
        border-bottom: 1px solid rgba(212,175,55,0.25);
        flex-shrink: 0;
    }
    .lesson-overlay-header .close-btn {
        background: linear-gradient(135deg, #d4af37, #fcd34d);
        color: #0b1d3a; border: none;
        padding: 10px 22px; border-radius: 40px;
        font-weight: 700; font-size: 0.9rem; cursor: pointer;
        display: flex; align-items: center; gap: 6px;
        box-shadow: 0 4px 15px rgba(212,175,55,0.4);
        touch-action: manipulation;
    }
    .lesson-overlay-header .close-btn:hover { transform: scale(1.03); }
    .lesson-overlay-header .title {
        flex: 1; text-align: center; font-weight: 700;
        color: #fcd34d; font-size: 1rem; letter-spacing: 0.5px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .lesson-overlay-header .spacer { width: 150px; flex-shrink: 0; }
    .lesson-overlay iframe { flex: 1; width: 100%; border: none; background: white; }
    /* ===== EJERCICIO ===== */
    .exercise-container {
        background: rgba(17,38,77,0.7);
        border: 1px solid rgba(212,175,55,0.2);
        border-radius: 20px; padding: 22px; margin-bottom: 16px;
    }
    .exercise-question { font-size: 0.85rem; color: #fcd34d; font-weight: 600; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
    .exercise-prompt {
        background: rgba(0,0,0,0.3); border-radius: 12px;
        padding: 18px; margin-bottom: 16px;
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        font-size: 1.35rem; font-weight: 600;
    }
    .exercise-prompt .phon { font-size: 0.85rem; color: #fcd34d; font-family: monospace; }
    .opt-btn {
        display: flex; align-items: center; gap: 8px;
        width: 100%; text-align: left;
        padding: 14px 18px; border-radius: 12px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        color: #cbd5e1; font-size: 0.95rem;
        cursor: pointer; transition: all 0.15s; margin-bottom: 8px;
        touch-action: manipulation;
    }
    .opt-btn:hover:not(:disabled) { background: rgba(212,175,55,0.12); border-color: rgba(212,175,55,0.4); }
    .opt-btn.correct { background: rgba(34,197,94,0.15); border-color: #22c55e; color: #86efac; }
    .opt-btn.incorrect { background: rgba(239,68,68,0.15); border-color: #ef4444; color: #fca5a5; }
    .opt-btn:disabled { cursor: default; opacity: 0.7; }
    .feedback-box { border-radius: 12px; padding: 14px; margin-top: 12px; font-size: 0.9rem; }
    .feedback-box.correct { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.4); color: #86efac; }
    .feedback-box.incorrect { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.4); color: #fca5a5; }
    .feedback-box.info { background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.4); color: #fde68a; }
    .progress-track { height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-bottom: 6px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #d4af37, #fcd34d); transition: width 0.3s; border-radius: 10px; }
    .next-btn {
        display: none; margin-top: 12px;
        background: linear-gradient(135deg, #d4af37, #fcd34d);
        color: #0b1d3a; font-weight: 700;
        padding: 12px 32px; border-radius: 40px;
        border: none; cursor: pointer; font-size: 0.9rem; transition: all 0.2s;
        touch-action: manipulation;
    }
    .next-btn:hover { transform: scale(1.03); }
    .next-btn.visible { display: inline-block; }
    .quit-btn {
        background: transparent; border: 1px solid rgba(255,255,255,0.15);
        color: #94a3b8; padding: 10px 22px; border-radius: 40px;
        cursor: pointer; font-size: 0.85rem;
        touch-action: manipulation;
    }
    .quit-btn:hover { border-color: #fcd34d; color: #fcd34d; }
    .text-input {
        width: 100%;
        background: rgba(0,0,0,0.3);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 12px;
        padding: 14px 16px;
        color: #fff;
        font-size: 1rem;
        outline: none;
        margin-bottom: 12px;
    }
    .text-input:focus { border-color: rgba(212,175,55,0.6); }
    .check-btn {
        background: #d4af37; color: #0b1d3a;
        font-weight: 700; padding: 12px 32px;
        border-radius: 40px; border: none;
        cursor: pointer; font-size: 0.9rem;
        touch-action: manipulation;
    }
    .result-box { text-align: center; padding: 40px 20px; }
    .result-box .emoji { font-size: 5rem; margin-bottom: 12px; }
    .result-box .score { font-size: 3.5rem; font-weight: 800; color: #fcd34d; }
    .result-box .detail { color: #94a3b8; margin-bottom: 24px; }
    .result-box .status { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
    .result-box .status.passed { color: #22c55e; }
    .result-box .status.failed { color: #f97316; }
    .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn-primary {
        background: linear-gradient(135deg, #d4af37, #fcd34d);
        color: #0b1d3a; font-weight: 700;
        padding: 14px 32px; border-radius: 40px;
        border: none; cursor: pointer; font-size: 0.95rem;
        touch-action: manipulation;
    }
    .btn-secondary {
        background: transparent; border: 1px solid rgba(255,255,255,0.2);
        color: #cbd5e1; padding: 14px 32px; border-radius: 40px;
        cursor: pointer; font-size: 0.95rem;
        touch-action: manipulation;
    }
    .footer {
        text-align: center; color: #546e7a; font-size: 0.75rem;
        padding-top: 18px; margin-top: 20px;
        border-top: 1px solid rgba(255,255,255,0.05);
    }
    .speak-btn {
        width: 34px; height: 34px; border-radius: 50%;
        background: rgba(212,175,55,0.2);
        border: 1px solid rgba(212,175,55,0.4);
        color: #fcd34d; font-size: 0.9rem;
        cursor: pointer; transition: all 0.2s;
        display: inline-flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        touch-action: manipulation;
    }
    .speak-btn:hover { background: rgba(212,175,55,0.4); }
    .speak-btn.speaking { background: #d4af37; color: #0b1d3a; animation: pulse 0.8s infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    .stars { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
    .star { font-size: 2.8rem; color: #334155; transition: color 0.3s; }
    .star.lit { color: #fcd34d; text-shadow: 0 0 20px rgba(252,211,77,0.6); }
    .celtic-border {
        height: 4px;
        background: repeating-linear-gradient(90deg, #d4af37 0, #d4af37 4px, transparent 4px, transparent 8px, #94a3b8 8px, #94a3b8 12px, transparent 12px, transparent 16px);
        opacity: 0.4; margin: 16px 0; border-radius: 2px;
    }

    /* ===== TOASTS ===== */
    .toast-container {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: calc(100% - 32px);
        max-width: 440px;
        pointer-events: none;
    }
    .toast {
        background: rgba(17,38,77,0.97);
        border: 1px solid rgba(252,211,77,0.45);
        border-radius: 16px;
        padding: 13px 16px;
        color: #f0f7ff;
        font-size: 0.88rem;
        box-shadow: 0 10px 35px rgba(0,0,0,0.65);
        display: flex;
        align-items: flex-start;
        gap: 10px;
        animation: toastIn 0.3s cubic-bezier(.34,1.56,.64,1);
        pointer-events: auto;
        backdrop-filter: blur(6px);
    }
    .toast.warn { border-color: rgba(239,68,68,0.55); }
    .toast.info { border-color: rgba(212,175,55,0.55); }
    .toast.success { border-color: rgba(34,197,94,0.55); }
    .toast .toast-icon { font-size: 1.3rem; line-height: 1.1; flex-shrink: 0; }
    .toast .toast-text { flex: 1; line-height: 1.35; }
    .toast .toast-text strong { display: block; color: #fcd34d; margin-bottom: 2px; font-size: 0.92rem; }
    .toast.out { animation: toastOut 0.3s ease forwards; }
    @keyframes toastIn {
        0% { opacity: 0; transform: translateY(-14px) scale(0.96); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toastOut {
        0% { opacity: 1; transform: translateY(0) scale(1); }
        100% { opacity: 0; transform: translateY(-10px) scale(0.97); }
    }

    /* ============================================================
       OPTIMIZACIÓN PARA TELÉFONO
       ============================================================ */
    @media (max-width: 600px) {
        body { padding: 8px; }
        .container { padding: 14px 12px; border-radius: 28px; }

        .header { padding: 10px 14px; border-radius: 60px; gap: 8px; }
        .logo-container { width: 54px; height: 54px; border-width: 2px; }
        .logo-fallback { font-size: 1.8rem; }

/* ============================================================
   0. SONIDOS (Web Audio API)
   ============================================================ */
let audioCtx = null;
function getAudioCtx() {
    if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}
function playCorrectSound() {
    try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        [523.25, 659.25, 783.99].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            const t = now + i * 0.075;
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.16, t + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0008, t + 0.32);
            osc.connect(gain).connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.36);
        });
    } catch (e) {}
}
function playWrongSound() {
    try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        [220, 164.81].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            const t = now + i * 0.13;
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.14, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0008, t + 0.28);
            osc.connect(gain).connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.32);
        });
    } catch (e) {}
}

/* ============================================================
   0b. TOASTS
   ============================================================ */
function showToast(message, type = 'info', title = '') {
    const container = document.getElementById('toastContainer');
    if (!container) return;

    const toast = document.createElement('div');
    toast.className = 'toast ' + type;

    let icon = 'ℹ️';
    if (type === 'warn')    icon = '🔒';
    if (type === 'error')   icon = '⚠️';
    if (type === 'success') icon = '✅';

    toast.innerHTML = `
        <span class="toast-icon">${icon}</span>
        <div class="toast-text">
            ${title ? `<strong>${title}</strong>` : ''}
            ${message}
        </div>
    `;
    container.appendChild(toast);

    setTimeout(() => {
        toast.classList.add('out');
        setTimeout(() => toast.remove(), 320);
    }, 4200);
}

    groups.forEach((group, gi) => {

            number: castleSeq,
            templeId: t.id,
            templeTitle: t.title,
            stageIndex: gi,
            stageTotal: groups.length,

            lessonNames: group.map(l => l.name)
        };
        CASTLES.push(castle);
        t.stages.push(castle);
    });
});

/* ============================================================
   4. ESTADO
   ============================================================ */
const STORAGE_KEY = "polyglots_castles_v2";

function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            const p = JSON.parse(raw);
            return { lessons: p.lessons || {}, castles: p.castles || {} };
        }
    } catch (e) {}
    return { lessons: {}, castles: {} };
}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
let state = loadState();

function lessonKey(tid, idx) { return 't' + tid + 'l' + idx; }
function isLessonDone(tid, idx) { return !!state.lessons[lessonKey(tid, idx)]; }
function markLessonVisited(tid, idx) {
    const k = lessonKey(tid, idx);
    if (!state.lessons[k]) {
        state.lessons[k] = true;
        saveState();
        updateGlobalProgress();
    }
}

function castleScore(id) { return state.castles[id] || 0; }
function isCastlePassed(id) { return castleScore(id) >= 70; }

function isCastleUnlocked(c) {
    if (c.number > 1 && !isCastlePassed(CASTLES[c.number - 2].id)) return false;
    return c.lessonIdx.every(i => isLessonDone(c.templeId, i));
}

function isTempleUnlocked(t) {
    if (t.id === 1) return true;
    const prev = TEMPLES[t.id - 2];
    const last = prev.stages[prev.stages.length - 1];
    return isCastlePassed(last.id);
}

function getGlobalProgress() {
    const totalLessons = TEMPLES.reduce((a, t) => a + t.lessons.length, 0);
    const total = totalLessons + CASTLES.length;
    if (!total) return 0;
    let done = 0;
    TEMPLES.forEach(t => t.lessons.forEach((l, i) => { if (isLessonDone(t.id, i)) done++; }));
    CASTLES.forEach(c => { if (isCastlePassed(c.id)) done++; });
    return Math.round((done / total) * 100);
}

   ============================================================ */
let voices = [];
function loadVoices() { if ('speechSynthesis' in window) voices = speechSynthesis.getVoices(); }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function getVoice(lang) {
    if (!voices.length) voices = speechSynthesis.getVoices();
    if (lang.startsWith('en')) {
        return voices.find(v => v.lang === 'en-US' && v.localService) ||
               voices.find(v => v.lang === 'en-US') ||
               voices.find(v => v.lang.startsWith('en'));
    }
    return voices.find(v => v.lang === 'es-ES' && v.localService) ||
           voices.find(v => v.lang === 'es-ES') ||
           voices.find(v => v.lang.startsWith('es'));
}
let speakingBtn = null;
function speak(text, btn, lang = 'en-US') {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    if (speakingBtn) speakingBtn.classList.remove('speaking');
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = 0.85; u.pitch = 1;
    const v = getVoice(lang); if (v) u.voice = v;
    if (btn) {
        btn.classList.add('speaking'); speakingBtn = btn;
        u.onend = () => { btn.classList.remove('speaking'); speakingBtn = null; };
        u.onerror = () => { btn.classList.remove('speaking'); speakingBtn = null; };
    }
    speechSynthesis.speak(u);
}
function escAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(a) { const b = a.slice(); for (let i = b.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }

   ============================================================ */
function getOrderedMarkers() {
    const arr = [];
    TEMPLES.forEach(t => {
        arr.push({ kind: 'temple', temple: t });
        t.stages.forEach(c => arr.push({ kind: 'castle', castle: c }));
    });
    return arr;
}

/* ============================================================
   9. RENDER DEL MAPA (escala progresiva de castillos)
   ============================================================ */
function renderMap() {
    const container = document.getElementById('mapContainer');
    container.querySelectorAll('.temple-marker').forEach(el => el.remove());

    const items = getOrderedMarkers();
    const isMobile = window.innerWidth <= 600;
    const cols = isMobile ? 2 : 4;
    const rows = Math.ceil(items.length / cols);
    const rowH = isMobile ? 205 : 240;

    container.style.height = (rows * rowH) + 'px';

    const pts = [];
    const totalCastles = CASTLES.length;

    items.forEach((item, i) => {
        const row = Math.floor(i / cols);
        let col = i % cols;
        if (row % 2 === 1) col = cols - 1 - col;

        const xPct = ((col + 0.5) / cols) * 100;
        const yPct = ((row + 0.5) / rows) * 100;
        pts.push([xPct, yPct]);

        const el = document.createElement('div');
        el.className = 'temple-marker';
        el.style.left = xPct + '%';
        el.style.top = yPct + '%';

        if (item.kind === 'temple') {
            const t = item.temple;
            const unlocked = isTempleUnlocked(t);
            const doneL = t.lessons.filter((l, idx) => isLessonDone(t.id, idx)).length;
            const prog = t.lessons.length ? doneL / t.lessons.length : 0;
            const allPassed = t.stages.every(c => isCastlePassed(c.id));

            // Escala progresiva del templo: 0.95 → 1.20
            const tScale = 0.95 + ((t.id - 1) / (TEMPLES.length - 1)) * 0.25;
            el.style.setProperty('--m-scale', tScale.toFixed(3));

            el.classList.add(allPassed ? 'complete' : (unlocked ? 'open' : 'locked'));
            el.innerHTML = templeSVG(prog, 'T' + t.id) + `
                <div class="temple-label">
                    <span class="num">TEMPLO ${t.id}</span>
                    ${escHtml(t.title)}
                </div>`;
            el.addEventListener('click', () => goKingdom(t.id));

        } else {
            const c = item.castle;
            const passed = isCastlePassed(c.id);
            const unlocked = isCastleUnlocked(c);

            // Escala progresiva del castillo: 0.85 → 1.45
            const cScale = 0.85 + ((c.number - 1) / (totalCastles - 1)) * 0.60;
            el.style.setProperty('--m-scale', cScale.toFixed(3));
            // Brillo creciente para castillos conquistados
            el.style.setProperty('--glow', (12 + c.number * 1.6).toFixed(1) + 'px');

            el.classList.add(passed ? 'complete' : (unlocked ? 'open' : 'locked'));
            el.innerHTML = castleSVG(passed, 'C' + c.number) + `
                <div class="temple-label">
                    <span class="num">CASTILLO ${c.number}</span>
                    ${escHtml(c.templeTitle)} · Etapa ${c.stageIndex + 1}
                </div>`;
            el.addEventListener('click', () => startCastle(c.id));
        }

        container.appendChild(el);
    });

    const d = pts.map((p, i) => (i === 0 ? 'M ' : 'L ') + p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join(' ');
    document.getElementById('mapPath').setAttribute('d', d);

    positionOwl();
    updateGlobalProgress();
}

function positionOwl() {
    const container = document.getElementById('mapContainer');
    const owl = document.getElementById('owlMarker');
    const items = getOrderedMarkers();

    let idx = items.findIndex(it => it.kind === 'castle' && !isCastlePassed(it.castle.id));
    if (idx === -1) idx = items.length - 1;

    const item = items[idx];
    let markerIdx = idx;

    if (item.kind === 'castle' && !isCastleUnlocked(item.castle) && !isCastlePassed(item.castle.id)) {
        const tIdx = items.findIndex(it => it.kind === 'temple' && it.temple.id === item.castle.templeId);
        if (tIdx >= 0) markerIdx = tIdx;
    }

    const markers = container.querySelectorAll('.temple-marker');
    const target = markers[markerIdx];
    if (!target) return;

    requestAnimationFrame(() => {
        const contRect = container.getBoundingClientRect();
        const r = target.getBoundingClientRect();
        if (!contRect.width || !contRect.height) return;
        owl.style.left = (((r.left + r.width / 2) - contRect.left) / contRect.width * 100) + '%';
        owl.style.top  = ((r.top - contRect.top) / contRect.height * 100) + '%';
    });
}

let currentTempleId = null;

function goKingdom(templeId) {
    const t = TEMPLES.find(x => x.id === templeId);
    if (!t) return;

    if (!isTempleUnlocked(t)) {
        showToast(
            `Debes conquistar el último castillo del Templo ${templeId - 1} para entrar aquí.`,
            'warn',
            'Templo bloqueado'
        );
        return;
    }

    currentTempleId = templeId;
    renderKingdom(t);
    showView('kingdom');

function renderKingdom(t) {
    const vocab = PHRASES_BY_TEMPLE[t.id] || [];

    document.getElementById('kingdomHeader').innerHTML = `
        <h2>${t.icon} Templo ${t.id} · ${escHtml(t.title)}</h2>
        <p>${escHtml(t.desc)}</p>
        <p style="margin-top:8px; font-size:0.8rem; color:#fcd34d;">

        return `

            </div>

    }).join('');

    document.getElementById('stagesContainer').innerHTML = stagesHtml;

    // Vocabulario del templo
    document.getElementById('vocabGrid').innerHTML = vocab.map(p => `
        <div class="vocab-card" data-en="${escAttr(p.en)}">
            <div class="vc-body">
                <div class="vc-en">${escHtml(p.en)}</div>
                <div class="vc-phon">[${escHtml(p.sp)}]</div>
                <div class="vc-es">${escHtml(p.es)}</div>
            </div>
            <span class="vc-speak">🔊</span>
        </div>`).join('');

    document.querySelectorAll('#vocabGrid .vocab-card').forEach(card => {
        card.addEventListener('click', () => {
            const sp = card.querySelector('.vc-speak');
            speak(card.dataset.en, sp);

    // Práctica enfocada
    document.getElementById('practiceGrid').innerHTML = PRACTICE_TYPES.map(pt => `

            <span class="icon">${pt.icon}</span>

function openLesson(templeId, lessonIdx) {
    const t = TEMPLES.find(x => x.id === templeId);
    if (!t) return;
    const l = t.lessons[lessonIdx];
    if (!l) return;

    document.getElementById('lessonOverlay').classList.add('active');

function closeLesson() {
    document.getElementById('lessonOverlay').classList.remove('active');

    document.body.style.overflow = '';

    if (currentTempleId) {
        const t = TEMPLES.find(x => x.id === currentTempleId);
        if (t) renderKingdom(t);
    }
    renderMap();
}

function updateGlobalProgress() {

   13. SESIONES
   ============================================================ */
let currentSession = null;

function startCastle(castleId) {
    const c = CASTLES.find(x => x.id === castleId);
    if (!c) return;

    if (!isCastleUnlocked(c) && !isCastlePassed(c.id)) {
        const missing = c.lessonIdx.filter(i => !isLessonDone(c.templeId, i));
        if (missing.length) {
            const names = missing.map(i => TEMPLES[c.templeId - 1].lessons[i].name).join(', ');
            showToast(
                `Completa estas lecciones primero: <b>${escHtml(names)}</b>`,
                'warn',
                `Castillo ${c.number} bloqueado`
            );
        } else {
            showToast(
                `Debes aprobar el Castillo ${c.number - 1} primero.`,
                'warn',
                `Castillo ${c.number} bloqueado`
            );
        }
        return;
    }

    const phrases = PHRASES_BY_TEMPLE[c.templeId] || [];
    if (!phrases.length) {
        showToast('No hay frases disponibles para este castillo.', 'error', 'Sin contenido');
        return;
    }

    const exercises = generateExercises('mixed', phrases).slice(0, SESSION_LEN);
    if (!exercises.length) {
        showToast('No se pudieron generar preguntas. Intenta de nuevo.', 'error', 'Error');
        return;
    }

    currentSession = {
        castleId: c.id,
        type: 'evaluation',
        exercises: exercises,
        currentIndex: 0,
        score: 0
    };
    showView('exercise');
    renderExercise();
}

function startExercise(templeId, type) {
    const phrases = PHRASES_BY_TEMPLE[templeId] || [];
    if (!phrases.length) {
        showToast('No hay frases disponibles para este templo.', 'error', 'Sin contenido');
        return;
    }
    const exercises = generateExercises(type, phrases).slice(0, SESSION_LEN);
    if (!exercises.length) {
        showToast('No se pudieron generar ejercicios. Intenta de nuevo.', 'error', 'Error');
        return;
    }

    currentSession = { templeId, type, exercises, currentIndex: 0, score: 0 };
    showView('exercise');
    renderExercise();
}

/* ============================================================
   14. GENERADORES
   ============================================================ */
function generateExercises(type, phrases) {
    switch(type) {
        case 'translate_es': return shuffle(genTranslateES(phrases));
        case 'translate_en': return shuffle(genTranslateEN(phrases));
        case 'fill_blank': return shuffle(genFillBlank(phrases));
        case 'order_words': return shuffle(genOrderWords(phrases));
        case 'listen': return shuffle(genListen(phrases));
        case 'listen_es': return shuffle(genListenES(phrases));
        case 'spell': return shuffle(genSpell(phrases));
        case 'true_false': return shuffle(genTrueFalse(phrases));
        case 'pronounce': return shuffle(genPronounce(phrases));
        case 'questions': return shuffle(genQuestions(phrases));
        case 'mixed': return genMixed(phrases);
        default: return [];
    }
}

function genTranslateES(phrases) {
    return phrases.map(p => {
        const d = shuffle(phrases.filter(x => x.es !== p.es).map(x => x.es)).slice(0, 3);
        return { type: 'translate_es', question: '¿Qué significa en español?', prompt: p.en, promptSp: p.sp,
                 options: shuffle([p.es, ...d]), correct: p.es, explanation: `"${p.en}" significa "${p.es}"` };
    });
}
function genTranslateEN(phrases) {
    return phrases.map(p => {
        const d = shuffle(phrases.filter(x => x.en !== p.en).map(x => x.en)).slice(0, 3);
        return { type: 'translate_en', question: '¿Cómo se dice en inglés?', prompt: p.es,
                 options: shuffle([p.en, ...d]), correct: p.en, explanation: `"${p.es}" se dice "${p.en}"` };
    });
}
function genFillBlank(phrases) {
    return phrases.map(p => {
        const words = p.en.split(/\s+/);
        if (words.length < 2) return null;
        const idx = 1 + Math.floor(Math.random() * (words.length - 1));
        const word = words[idx].replace(/[.,!?;:'"]+$/, '').replace(/^[.,!?;:'"]+/, '');
        const blanked = words.map((w, i) => i === idx ? '___' : w).join(' ');
        return { type: 'fill_blank', question: 'Escribe la palabra que falta:', prompt: blanked,
                 hint: p.es, correct: word, explanation: `Frase completa: "${p.en}"` };
    }).filter(Boolean);
}
function genOrderWords(phrases) {
    return phrases.map(p => {
        const words = p.en.split(/\s+/);
        if (words.length < 3) return null;
        let sh = shuffle([...words]);
        if (sh.join(' ') === words.join(' ')) [sh[0], sh[1]] = [sh[1], sh[0]];
        return { type: 'order_words', question: 'Ordena las palabras:', prompt: p.es,
                 words: sh, correct: p.en, explanation: `La oración correcta es: "${p.en}"` };
    }).filter(Boolean);
}
function genListen(phrases) {
    return phrases.map(p => {
        const d = shuffle(phrases.filter(x => x.en !== p.en).map(x => x.en)).slice(0, 3);
        return { type: 'listen', question: 'Escucha y elige la frase que oíste:', audio: p.en,
                 options: shuffle([p.en, ...d]), correct: p.en, explanation: `Escuchaste: "${p.en}" — ${p.es}` };
    });
}
function genListenES(phrases) {
    return phrases.map(p => {
        const d = shuffle(phrases.filter(x => x.es !== p.es).map(x => x.es)).slice(0, 3);
        return { type: 'listen_es', question: 'Escucha y elige el significado en español:', audio: p.en,
                 options: shuffle([p.es, ...d]), correct: p.es, explanation: `"${p.en}" = "${p.es}"` };
    });
}
function genSpell(phrases) {
    return phrases.map(p => ({
        type: 'spell',
        question: 'Escucha y escribe la frase en inglés:',
        audio: p.en,
        hint: p.es,
        correct: p.en,
        explanation: `La frase era: "${p.en}"`
    }));
}
function genTrueFalse(phrases) {
    return phrases.map(p => {
        const isTrue = Math.random() < 0.5;
        const others = phrases.filter(x => x.es !== p.es);
        const fakeEs = others.length ? others[Math.floor(Math.random() * others.length)].es : p.es + ' (?)';
        const claim = isTrue ? p.es : fakeEs;
        return {
            type: 'true_false',
            question: '¿La traducción es correcta?',
            prompt: p.en,
            claim: claim,
            options: ['Verdadero', 'Falso'],
            correct: isTrue ? 'Verdadero' : 'Falso',
            explanation: isTrue
                ? `"${p.en}" = "${p.es}"`
                : `"${p.en}" NO significa "${claim}", significa "${p.es}"`
        };
    });
}
function genPronounce(phrases) {
    return phrases.map(p => ({ type: 'pronounce', question: 'Pronuncia esta frase en voz alta:',
                               target: p.en, targetSp: p.sp, meaning: p.es }));
}
function genQuestions(phrases) {
    const qs = [];
    phrases.forEach(p => {
        const d1 = shuffle(phrases.filter(x => x.es !== p.es).map(x => x.es)).slice(0, 3);
        qs.push({ type: 'question', question: `¿Qué significa "${p.en}" en español?`,
                  options: shuffle([p.es, ...d1]), correct: p.es, explanation: `"${p.en}" = "${p.es}"` });
        const d2 = shuffle(phrases.filter(x => x.en !== p.en).map(x => x.en)).slice(0, 3);
        qs.push({ type: 'question', question: `¿Cómo se dice "${p.es}" en inglés?`,
                  options: shuffle([p.en, ...d2]), correct: p.en, explanation: `"${p.es}" = "${p.en}"` });
    });
    return qs;
}
function genMixed(phrases) {
    return shuffle([
        ...shuffle(genTranslateES(phrases)).slice(0, 2),
        ...shuffle(genTranslateEN(phrases)).slice(0, 2),
        ...shuffle(genFillBlank(phrases)).slice(0, 2),
        ...shuffle(genOrderWords(phrases)).slice(0, 2),
        ...shuffle(genListen(phrases)).slice(0, 1),
        ...shuffle(genListenES(phrases)).slice(0, 1),
        ...shuffle(genSpell(phrases)).slice(0, 1),
        ...shuffle(genTrueFalse(phrases)).slice(0, 2),
        ...shuffle(genPronounce(phrases)).slice(0, 1),
        ...shuffle(genQuestions(phrases)).slice(0, 1)
    ]);
}

    document.getElementById('exProgressLabel').textContent = `Misión ${s.currentIndex + 1} / ${total}`;
    document.getElementById('exScore').textContent = `✓ ${s.score}`;

/* ============================================================
   16. RESPUESTAS
   ============================================================ */
function answerMultipleChoice(btn, ex) {
    const s = currentSession;
    const buttons = btn.parentElement.querySelectorAll('.opt-btn');
    buttons.forEach(b => { b.disabled = true; if (b.textContent === ex.correct) b.classList.add('correct'); });
    const isCorrect = btn.textContent === ex.correct;
    if (!isCorrect) btn.classList.add('incorrect'); else s.score++;

    if (isCorrect) playCorrectSound(); else playWrongSound();

    document.getElementById('exScore').textContent = `✓ ${s.score}`;
    showFeedback(isCorrect, ex);

    if (isCorrect) {
        setTimeout(() => { if (currentSession === s) nextExercise(); }, 1200);
    } else {
        const nb = document.getElementById('nextExBtn');
        nb.classList.add('visible');
        nb.textContent = 'Entendido, continuar →';
        nb.onclick = () => nextExercise();
    }
}

function answerFillBlank(ex) {
    const s = currentSession;
    const input = document.getElementById('fillInput');
    const val = input.value.trim().toLowerCase().replace(/[.,!?;:'"]/g, '');
    const correct = ex.correct.toLowerCase().replace(/[.,!?;:'"]/g, '');
    const isCorrect = val === correct;
    if (isCorrect) s.score++;

    if (isCorrect) playCorrectSound(); else playWrongSound();

    input.disabled = true;
    document.getElementById('fillCheck').disabled = true;
    document.getElementById('exScore').textContent = `✓ ${s.score}`;
    showFeedback(isCorrect, ex);

    if (isCorrect) {
        setTimeout(() => { if (currentSession === s) nextExercise(); }, 1200);
    } else {
        const nb = document.getElementById('nextExBtn');
        nb.classList.add('visible');
        nb.textContent = 'Entendido, continuar →';
        nb.onclick = () => nextExercise();
    }
}

function normText(s) {
    return String(s).toLowerCase()
        .replace(/[¿¡.,!?;:'"]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
}

function answerSpell(ex) {
    const s = currentSession;
    const input = document.getElementById('spellInput');
    const val = normText(input.value);
    const correct = normText(ex.correct);
    const isCorrect = val === correct && val.length > 0;
    if (isCorrect) s.score++;

    if (isCorrect) playCorrectSound(); else playWrongSound();

    input.disabled = true;
    document.getElementById('spellCheck').disabled = true;
    document.getElementById('exScore').textContent = `✓ ${s.score}`;
    showFeedback(isCorrect, ex, isCorrect ? '' : `Tu respuesta: "${escHtml(input.value)}"`);

    if (isCorrect) {
        setTimeout(() => { if (currentSession === s) nextExercise(); }, 1400);
    } else {
        const nb = document.getElementById('nextExBtn');
        nb.classList.add('visible');
        nb.textContent = 'Entendido, continuar →';
        nb.onclick = () => nextExercise();
    }
}

function renderOrderWords(ex) {
    const s = currentSession;
    let placed = [];
    let available = ex.words.map((w, i) => ({ w, used: false }));

    function draw() {
        const wa = document.getElementById('wordsArea');
        wa.innerHTML = available.map((it, i) => it.used ? '' :
            `<span class="word-chip" data-idx="${i}" style="padding:10px 16px; border-radius:8px; background:rgba(212,175,55,0.15); border:1px solid rgba(212,175,55,0.4); color:#fde68a; cursor:pointer; font-size:0.95rem; touch-action:manipulation;">${escHtml(it.w)}</span>`
        ).join('');
        wa.querySelectorAll('.word-chip').forEach(ch => {
            ch.addEventListener('click', () => {
                const i = parseInt(ch.dataset.idx);
                if (available[i].used) return;
                available[i].used = true;
                placed.push({ w: available[i].w, idx: i });
                draw();
            });
        });

        const ans = document.getElementById('answerArea');
        ans.innerHTML = placed.length
            ? placed.map((p, j) => `<span class="answer-slot" data-j="${j}" style="padding:10px 16px; border-radius:8px; background:rgba(17,38,77,0.8); border:1px dashed rgba(212,175,55,0.4); color:#fde68a; cursor:pointer; font-size:0.95rem; touch-action:manipulation;">${escHtml(p.w)}</span>`).join('')
            : '<span style="color:#64748b; font-size:0.9rem;">Toca las palabras de abajo…</span>';
        ans.querySelectorAll('.answer-slot').forEach(sl => {
            sl.addEventListener('click', () => {
                const j = parseInt(sl.dataset.j);
                available[placed[j].idx].used = false;
                placed.splice(j, 1);
                draw();
            });
        });
    }

    draw();

    document.getElementById('orderReset').addEventListener('click', () => {
        placed = [];
        available = ex.words.map(w => ({ w, used: false }));
        draw();
    });

    document.getElementById('orderCheck').addEventListener('click', () => {
        const user = placed.map(p => p.w).join(' ').trim();
        const isCorrect = user.toLowerCase() === ex.correct.toLowerCase();
        if (isCorrect) s.score++;

        if (isCorrect) playCorrectSound(); else playWrongSound();

        document.getElementById('orderCheck').disabled = true;
        document.querySelectorAll('.word-chip').forEach(c => c.style.pointerEvents = 'none');
        document.getElementById('exScore').textContent = `✓ ${s.score}`;
        showFeedback(isCorrect, ex, `Tu respuesta: "${escHtml(user)}"`);

        if (isCorrect) {
            setTimeout(() => { if (currentSession === s) nextExercise(); }, 1200);
        } else {
            const nb = document.getElementById('nextExBtn');
            nb.classList.add('visible');
            nb.textContent = 'Entendido, continuar →';
            nb.onclick = () => nextExercise();
        }
    });
}

function showFeedback(correct, ex, extra) {
    const fb = document.getElementById('feedback');
    if (!fb) return;
    fb.innerHTML = `<div class="feedback-box ${correct ? 'correct' : 'incorrect'}">
        <p style="font-weight:600; margin-bottom:2px;">${correct ? '✓ ¡Correcto!' : '✗ Incorrecto'}</p>
        <p style="font-size:0.85rem;">${escHtml(ex.explanation || '')}</p>
        ${extra ? `<p style="font-size:0.75rem; opacity:0.8; margin-top:2px;">${extra}</p>` : ''}
    </div>`;
}

function nextExercise() {
    const s = currentSession;
    s.currentIndex++;
    if (s.currentIndex >= s.exercises.length) finishExercise();
    else renderExercise();
}

/* ============================================================
   17. RESULTADOS
   ============================================================ */
function finishExercise() {
    const s = currentSession;
    if (!s) return;

    const total = s.exercises.length;
    const pct = total ? Math.round((s.score / total) * 100) : 0;
    const stars = pct >= 85 ? 3 : (pct >= 70 ? 2 : (pct >= 50 ? 1 : 0));
    const starEls = document.querySelectorAll('#resultsStars .star');
    starEls.forEach((el, i) => el.classList.toggle('lit', i < stars));

    if (s.castleId) {
        const c = CASTLES.find(x => x.id === s.castleId);
        state.castles[s.castleId] = Math.max(castleScore(s.castleId), pct);
        saveState();

        const passed = pct >= 70;

        document.getElementById('resultsEmoji').textContent = passed ? '🏆' : '📚';
        document.getElementById('resultsTitle').textContent = passed ? '¡Castillo Conquistado!' : 'Castillo Resistido';
        document.getElementById('resultsSubtitle').textContent =
            `Castillo ${c.number} · Templo ${c.templeId} (${c.templeTitle}) · Etapa ${c.stageIndex + 1}`;
        document.getElementById('resultsScore').textContent = pct + '%';
        document.getElementById('resultsDetail').textContent = `${s.score} de ${total} correctas`;

        const statusEl = document.getElementById('resultsStatus');
        statusEl.textContent = passed ? '✅ APROBADO' : '❌ NO APROBADO (necesitas 70%)';
        statusEl.className = 'status ' + (passed ? 'passed' : 'failed');

        showView('results');
        updateGlobalProgress();
        renderMap();
        return;
    }

    document.getElementById('resultsEmoji').textContent = pct >= 85 ? '🌟' : (pct >= 70 ? '🎉' : (pct >= 50 ? '💪' : '📚'));
    document.getElementById('resultsTitle').textContent = pct >= 85 ? '¡Excelente!' : (pct >= 70 ? '¡Muy bien!' : (pct >= 50 ? 'Buen intento' : 'Sigue practicando'));
    document.getElementById('resultsSubtitle').textContent = PRACTICE_TYPES.find(p => p.id === s.type)?.name || 'Práctica mixta';
    document.getElementById('resultsScore').textContent = pct + '%';
    document.getElementById('resultsDetail').textContent = `${s.score} de ${total} correctas`;
    document.getElementById('resultsStatus').textContent = '';

    showView('results');
    updateGlobalProgress();
}

function templeOfSession(s) {
    if (!s) return null;
    if (s.castleId) {
        const c = CASTLES.find(x => x.id === s.castleId);
        return c ? c.templeId : null;
    }
    return s.templeId;
}

function retryExercise() {
    if (!currentSession) return;
    if (currentSession.castleId) startCastle(currentSession.castleId);
    else startExercise(currentSession.templeId, currentSession.type);
}

function goBackToKingdom() {
    const tid = templeOfSession(currentSession);
    if (tid) goKingdom(tid);
    else showView('map');
}

function quitExercise() {
    const tid = templeOfSession(currentSession);
    if (tid) goKingdom(tid);
    else showView('map');
}

/* ============================================================
   18. INICIO
   ============================================================ */
showView('map');
renderMap();

let resizeTimer;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { renderMap(); }, 200);
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.getElementById('lessonOverlay').classList.contains('active')) {
        closeLesson();
    }
});
</script>
